<title>TrustNav-IMU Mission Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed instrument rail on the left, one "page" at a time on the right, each page a grid of instrument panels.
   Single dark look on purpose (matches the TrustNav brand screens). */
:root{
  --bg:#060B16; --bg2:#08101F; --panel:#0C1527; --panel2:#101B31; --line:#1A2742; --line2:#253658;
  --fg:#E6EDF8; --muted:#8B9AB7; --dim:#5A6A8A;
  --cyan:#22D3EE; --blue:#2563EB; --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444; --violet:#A78BFA; --rose:#FB7185;
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at var(--mx,70%) var(--my,10%),rgba(34,211,238,.07),transparent 60%),
             radial-gradient(700px 600px at 0% 100%,rgba(37,99,235,.08),transparent 60%);}
.bgfx::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 60% 20%,#000 0%,transparent 70%)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;min-height:100%}
/* rail */
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 12px 18px max(12px,env(safe-area-inset-left,0px));
  border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),var(--bg));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.brand img{width:36px;height:36px;filter:drop-shadow(0 0 12px rgba(34,211,238,.45));animation:float 6s ease-in-out infinite}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{font-family:var(--f-mono);font-size:10px;color:var(--cyan);letter-spacing:.14em}
.navgrp{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding:8px 10px 2px}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px;transition:color .25s,transform .25s var(--ease)}
.nav a:hover{color:var(--fg);transform:translateX(3px)}
.nav a.on{color:var(--fg)}
.nav a i{width:16px;height:16px;flex:none;opacity:.8}
.nav a.on i{color:var(--cyan);opacity:1}
.navind{position:absolute;left:0;right:0;height:34px;border-radius:8px;z-index:0;background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(37,99,235,.06));
  border:1px solid rgba(34,211,238,.28);transition:transform .45s var(--ease),height .45s var(--ease);box-shadow:0 0 24px -8px var(--cyan)}
.navind::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.railfoot{margin-top:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);padding:8px 10px;border-top:1px solid var(--line)}
/* main */
main{min-width:0;padding-block:18px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;
  padding:10px 0 12px;margin-bottom:14px;background:linear-gradient(var(--bg) 70%,transparent)}
.crumb{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.crumb b{color:var(--cyan);font-weight:500}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.seg button{font:500 11.5px var(--f-mono);color:var(--muted);background:none;border:0;padding:6px 9px;border-radius:7px;cursor:pointer;transition:all .2s}
.seg button:hover{color:var(--fg)}
.seg button.on{color:#04121a;background:var(--cyan);box-shadow:0 0 16px -4px var(--cyan)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite}
.pill.warn .dot{background:var(--warn)} .pill.bad .dot{background:var(--bad)}
/* pages */
.page{display:none}
.page.on{display:block;animation:pageIn .7s var(--ease) both}
.page.on .rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 80ms)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.08;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),#7dd3fc 40%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 6s linear infinite}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0;letter-spacing:.005em}
.lede{color:var(--muted);max-width:72ch;margin:0 0 20px;font-size:14.5px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--cyan)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{position:relative;min-width:0;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:16px;
  transition:transform .35s var(--ease),border-color .3s,box-shadow .35s;transform-style:preserve-3d}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--cyan);opacity:.0;transition:opacity .3s,transform .35s var(--ease)}
.card::before{top:-1px;left:-1px;border-top:1.5px solid;border-left:1.5px solid;border-top-left-radius:12px;transform:translate(4px,4px)}
.card::after{bottom:-1px;right:-1px;border-bottom:1.5px solid;border-right:1.5px solid;border-bottom-right-radius:12px;transform:translate(-4px,-4px)}
.card:hover{border-color:var(--line2);box-shadow:0 18px 40px -24px rgba(34,211,238,.35)}
.card:hover::before,.card:hover::after{opacity:.9;transform:none}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.tile .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--ok)} .dn{color:var(--bad)} .cy{color:var(--cyan)} .wa{color:var(--warn)} .vi{color:var(--violet)}
canvas{display:block;width:100%;max-width:100%}
.cv{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font:11px var(--f-mono);color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr{transition:background .2s} tbody tr:hover{background:rgba(34,211,238,.04)}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
.tw{overflow-x:auto}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--cyan));transform-origin:left;animation:grow 1.2s var(--ease) both}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--warn);padding:8px 12px;background:rgba(245,158,11,.06);border-radius:0 8px 8px 0}
.note b{color:var(--fg)}
.btn{font:600 12px var(--f-body);color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn:hover::after{transform:translateX(120%)}
.btn.pri{background:linear-gradient(90deg,var(--blue),#0e7490);border-color:transparent}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
input[type=range]{width:100%;accent-color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:rgba(34,197,94,.35)} .chip.bad{color:var(--bad);border-color:rgba(239,68,68,.35)} .chip.warn{color:var(--warn);border-color:rgba(245,158,11,.35)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;position:relative}
.node{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.node .num{font:500 10px var(--f-mono);color:var(--cyan);letter-spacing:.12em}
.node b{display:block;font-family:var(--f-display);font-size:14px;margin:4px 0 4px}
.node p{margin:0;font-size:12px;color:var(--muted)}
.node::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);background-size:200% 100%;animation:flowline 2.4s linear infinite;animation-delay:calc(var(--i,0)*.3s);opacity:.8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.scan{position:absolute;inset:0;pointer-events:none;border-radius:12px;overflow:hidden}
.scan::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,rgba(34,211,238,.07),transparent);animation:scan 5s linear infinite}
.timeline{position:relative;height:46px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.timeline .z{position:absolute;top:0;bottom:0}
.timeline .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);box-shadow:0 0 12px var(--cyan)}
.timeline .lab{position:absolute;bottom:3px;font:10px var(--f-mono);color:var(--fg);white-space:nowrap;padding-left:4px}
.src li{margin-bottom:10px}
.src li span{display:block;color:var(--muted);font-size:12.5px}
ul.clean{margin:0;padding-left:18px} ul.clean li{margin:4px 0}
code{font-family:var(--f-mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
pre{font-family:var(--f-mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;margin:0;color:#cfe3ff}
.menu{display:none}
@keyframes pageIn{from{opacity:.0;transform:translateY(14px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:.0;transform:translateY(18px) rotateX(8deg)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes sheen{to{background-position:-200% 0}}
@keyframes float{50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flowline{to{background-position:-200% 0}}
@keyframes scan{to{top:100%}}
@media (max-width:1100px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 12}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .4s var(--ease);height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  .menu{display:inline-flex}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .c3{grid-column:span 12}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function setup(cv,h){const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);const w=Math.max(200,r.width);cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return [x,w,h]}
const anims=new Set();
function animate(fn,dur=1100){if(RM){fn(1);return}const t0=performance.now();const o={stop:false};anims.add(o);(function f(t){if(o.stop)return;const k=Math.min(1,(t-t0)/dur);fn(1-Math.pow(1-k,3));if(k<1)requestAnimationFrame(f);else anims.delete(o)})(t0);return o}
function stopAll(){anims.forEach(o=>o.stop=true);anims.clear()}
function niceTicks(lo,hi,n=5){const s=(hi-lo)/n,m=Math.pow(10,Math.floor(Math.log10(s))),st=[1,2,2.5,5,10].map(x=>x*m).find(x=>x>=s);const a=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)a.push(+v.toFixed(10));return a}
// line chart: series [{x:[],y:[],c,w,fill,dash}], opts {h,ylab,xlab,bands:[[x0,x1,color,label]],vlines,ymax,ymin,log}
function lineChart(cv,series,o={}){
 const [x,w,h]=setup(cv,o.h||220);const pl=46,pr=12,pt=12,pb=26;
 let xs=series.flatMap(s=>s.x),ys=series.flatMap(s=>s.y).filter(Number.isFinite);
 const x0=o.xmin??Math.min(...xs),x1=o.xmax??Math.max(...xs);let y0=o.ymin??Math.min(0,...ys),y1=o.ymax??Math.max(...ys)*1.08;if(y1<=y0)y1=y0+1;
 const lg=o.log, ty=v=>lg?Math.log10(Math.max(v,1e-3)):v; if(lg){y0=Math.log10(o.ymin||0.1);y1=Math.log10(o.ymax||Math.max(...ys)*2)}
 const X=v=>pl+(v-x0)/(x1-x0)*(w-pl-pr),Y=v=>pt+(1-(ty(v)-y0)/(y1-y0))*(h-pt-pb);
 return animate(k=>{
  x.clearRect(0,0,w,h);x.font='10px "JetBrains Mono",monospace';
  (o.bands||[]).forEach(b=>{x.fillStyle=b[2];x.fillRect(X(b[0]),pt,X(b[1])-X(b[0]),h-pt-pb);if(b[3]){x.fillStyle=C.muted;x.fillText(b[3],X(b[0])+3,pt+10)}});
  const yt=lg?[...Array(Math.floor(y1-y0)+1)].map((_,i)=>Math.pow(10,Math.ceil(y0)+i)).filter(v=>Math.log10(v)<=y1):niceTicks(y0,y1,4);
  x.strokeStyle=C.line;x.lineWidth=1;x.fillStyle=C.dim;x.textAlign='right';
  yt.forEach(v=>{const yy=Y(v);x.beginPath();x.moveTo(pl,yy);x.lineTo(w-pr,yy);x.stroke();x.fillText(lg?(v>=1000?v/1000+'k':v):(+v.toFixed(2)),pl-6,yy+3)});
  x.textAlign='center';niceTicks(x0,x1,Math.max(3,Math.floor(w/90))).forEach(v=>x.fillText(v,X(v),h-8));
  if(o.ylab){x.save();x.translate(10,pt+(h-pt-pb)/2);x.rotate(-Math.PI/2);x.fillText(o.ylab,0,0);x.restore()}
  if(o.xlab){x.textAlign='right';x.fillText(o.xlab,w-pr,h-8)}
  const xc=x0+(x1-x0)*k;
  series.forEach(s=>{x.beginPath();let st=false,lx=0,ly=0;for(let i=0;i<s.x.length;i++){if(s.x[i]>xc)break;const v=s.y[i];if(!Number.isFinite(v)){st=false;continue}const px=X(s.x[i]),py=Y(Math.max(v,lg?1e-3:-1e9));st?x.lineTo(px,py):x.moveTo(px,py);st=true;lx=px;ly=py}
   x.strokeStyle=s.c;x.lineWidth=s.w||1.6;x.setLineDash(s.dash||[]);x.stroke();x.setLineDash([]);
   if(s.fill&&st){x.lineTo(lx,Y(lg?Math.pow(10,y0):Math.max(0,y0)));x.lineTo(X(s.x[0]),Y(lg?Math.pow(10,y0):Math.max(0,y0)));x.closePath();const g=x.createLinearGradient(0,pt,0,h-pb);g.addColorStop(0,s.fill);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fill()}
   if(st&&s.dot!==false){x.fillStyle=s.c;x.beginPath();x.arc(lx,ly,3,0,7);x.fill();x.strokeStyle=s.c;x.globalAlpha=.3;x.beginPath();x.arc(lx,ly,7,0,7);x.stroke();x.globalAlpha=1}});
  (o.vlines||[]).forEach(v=>{x.strokeStyle=v[1];x.setLineDash([4,4]);x.beginPath();x.moveTo(X(v[0]),pt);x.lineTo(X(v[0]),h-pb);x.stroke();x.setLineDash([]);if(v[2]){x.fillStyle=v[1];x.textAlign='left';x.fillText(v[2],X(v[0])+4,pt+22)}});
 },o.dur||1300)}
function barChart(cv,items,o={}){ // items [{l,v,c}] horizontal, log optional
 const [x,w,h]=setup(cv,o.h||items.length*34+20);const pl=o.pl||190,pr=70;const mx=Math.max(...items.map(i=>i.v));
 const sc=v=>o.log?Math.log10(1+v)/Math.log10(1+mx):v/mx;
 return animate(k=>{x.clearRect(0,0,w,h);items.forEach((it,i)=>{const y=10+i*34;x.font='12px Inter,sans-serif';x.fillStyle=C.muted;x.textAlign='right';x.fillText(it.l,pl-10,y+15);
  x.fillStyle=C.line;x.fillRect(pl,y+6,w-pl-pr,12);const bw=(w-pl-pr)*sc(it.v)*k;const g=x.createLinearGradient(pl,0,pl+bw,0);g.addColorStop(0,C.blue);g.addColorStop(1,it.c||C.cyan);x.fillStyle=g;x.fillRect(pl,y+6,Math.max(2,bw),12);
  x.fillStyle=C.fg;x.textAlign='left';x.font='11px "JetBrains Mono",monospace';x.fillText(o.f?o.f(it.v*k):it.v.toFixed(2),pl+bw+6,y+16)})},o.dur||1200)}
// 3D trajectory with orbit
function traj3d(cv,opts){
 const [x,w,h]=setup(cv,opts.h||360);const S=D.seq[seq];const gt=S.gt,es=S.est,t=S.t,ev=S.events;
 const all=gt;const mn=[0,1,2].map(i=>Math.min(...all.map(p=>p[i]))),mxv=[0,1,2].map(i=>Math.max(...all.map(p=>p[i])));
 const cen=mn.map((v,i)=>(v+mxv[i])/2),span=Math.max(...mxv.map((v,i)=>v-mn[i]))||1;
 let yaw=0.7,pitch=0.55,drag=null,zoom=1,head=opts.head??1,auto=!RM;const st={stop:false};anims.add(st);
 cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,yaw,pitch];auto=false;cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*0.01;pitch=Math.max(-1.4,Math.min(1.4,drag[3]+(e.clientY-drag[1])*0.01))};
 cv.onpointerup=()=>drag=null;cv.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*(e.deltaY<0?1.1:.9)))};
 const P=p=>{const a=(p[0]-cen[0])/span,b=(p[1]-cen[1])/span,c=(p[2]-cen[2])/span;const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const X1=a*cy-b*sy,Y1=a*sy+b*cy;const Z2=c*cp-Y1*sp,Y2=c*sp+Y1*cp;const s=Math.min(w,h)*1.25*zoom/(1.8+Y2*0.6);return [w/2+X1*s,h/2-Z2*s,Y2]};
 const phase=ti=>{if(ti>=ev.failure)return 'blind';for(const d of ev.dropouts)if(ti>=d[0]&&ti<d[1])return 'drop';return 'ok'};
 const draw=()=>{if(st.stop)return;if(auto)yaw+=0.0025;const hi=Math.floor(head*(t.length-1));
  x.clearRect(0,0,w,h);
  // floor grid
  x.strokeStyle=C.line;x.lineWidth=1;for(let i=-5;i<=5;i++){const a=P([cen[0]+i*span/10,cen[1]-span/2,mn[2]]),b=P([cen[0]+i*span/10,cen[1]+span/2,mn[2]]);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();
   const c=P([cen[0]-span/2,cen[1]+i*span/10,mn[2]]),d=P([cen[0]+span/2,cen[1]+i*span/10,mn[2]]);x.beginPath();x.moveTo(c[0],c[1]);x.lineTo(d[0],d[1]);x.stroke()}
  // gt
  x.strokeStyle='rgba(230,237,248,.55)';x.lineWidth=1.4;x.beginPath();gt.forEach((p,i)=>{if(i>hi)return;const q=P(p);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.stroke();
  // est colored by phase
  let prev=null,ph=null;x.lineWidth=2;
  for(let i=0;i<=hi;i++){const q=P(es[i]);const p2=phase(t[i]);if(prev){x.strokeStyle=p2==='blind'?C.rose:p2==='drop'?C.warn:C.cyan;x.beginPath();x.moveTo(prev[0],prev[1]);x.lineTo(q[0],q[1]);x.stroke()}prev=q}
  // error tether at head
  const a=P(gt[hi]),b=P(es[hi]);x.strokeStyle='rgba(167,139,250,.7)';x.setLineDash([3,3]);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.setLineDash([]);
  const pulse=(performance.now()/600)%1;x.fillStyle=C.fg;x.beginPath();x.arc(a[0],a[1],3.5,0,7);x.fill();
  x.fillStyle=C.cyan;x.beginPath();x.arc(b[0],b[1],4.5,0,7);x.fill();x.strokeStyle=C.cyan;x.globalAlpha=1-pulse;x.beginPath();x.arc(b[0],b[1],5+pulse*14,0,7);x.stroke();x.globalAlpha=1;
  if(opts.onHead)opts.onHead(hi);
  requestAnimationFrame(draw)};
 draw();return {set:v=>{head=v},stop:()=>st.stop=true}}

const head=(eb,title,lede)=>`<div class="rise" style="--i:0"><div class="eyebrow">${eb}</div><h1>${title}</h1><p class="lede">${lede}</p></div>`;
const tbl=(heads,rows,num)=>`<div class="tw"><table><thead><tr>${heads.map((h,i)=>`<th class="${(num||[]).includes(i)?'n':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${(num||[]).includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const sname=s=>s.replace('_',' ');
const P2=v=>v.toFixed(2);
function phases(S){const ev=S.events,inDrop=t=>ev.dropouts.some(d=>t>=d[0]&&t<d[1]);
 const def=[['Clean',t=>t<ev.noise_start,C.ok],['Noise ramp',t=>t>=ev.noise_start&&t<ev.bias_start&&!inDrop(t),C.warn],['Noise + bias drift',t=>t>=ev.bias_start&&t<ev.failure&&!inDrop(t),C.violet],['Inside dropouts',t=>inDrop(t),C.warn],['Blind 5 s',t=>t>=ev.failure,C.rose]];
 return def.map(([n,f,c])=>{const v=S.t.map((t,i)=>f(t)?S.err[i]:null).filter(x=>x!=null);return {n,c,mean:v.reduce((a,b)=>a+b,0)/Math.max(1,v.length),max:Math.max(...v),secs:v.length/5}})}
function speed(arr,t){return arr.map((p,i)=>{if(i===0)return 0;const d=Math.hypot(p[0]-arr[i-1][0],p[1]-arr[i-1][1],p[2]-arr[i-1][2]);return d/Math.max(1e-3,t[i]-t[i-1])})}
function topdown(cv,h){const [x,w]=setup(cv,h);const S=D.seq[seq];const all=S.gt.concat(S.est);const mnx=Math.min(...all.map(p=>p[0])),mxx=Math.max(...all.map(p=>p[0])),mny=Math.min(...all.map(p=>p[1])),mxy=Math.max(...all.map(p=>p[1]));
 const sc=Math.min((w-40)/(mxx-mnx||1),(h-40)/(mxy-mny||1)),ox=(w-(mxx-mnx)*sc)/2,oy=(h-(mxy-mny)*sc)/2;const X_=p=>ox+(p[0]-mnx)*sc,Y_=p=>h-oy-(p[1]-mny)*sc;
 return animate(k=>{x.clearRect(0,0,w,h);x.strokeStyle=C.line;for(let g=0;g<=10;g++){x.beginPath();x.moveTo(20+g*(w-40)/10,20);x.lineTo(20+g*(w-40)/10,h-20);x.stroke();x.beginPath();x.moveTo(20,20+g*(h-40)/10);x.lineTo(w-20,20+g*(h-40)/10);x.stroke()}
  const n=Math.floor(S.gt.length*k);[[S.gt,'rgba(230,237,248,.6)',1.3],[S.est,C.cyan,1.8]].forEach(([a,c,lw])=>{x.strokeStyle=c;x.lineWidth=lw;x.beginPath();a.slice(0,n).forEach((p,i)=>i?x.lineTo(X_(p),Y_(p)):x.moveTo(X_(p),Y_(p)));x.stroke()});
  x.fillStyle=C.dim;x.font='10px "JetBrains Mono",monospace';x.fillText('1 m = '+sc.toFixed(0)+' px · top view (x–y)',22,h-6)},1800)}

T.pipeline=()=>head('Pipeline','Seven stages, <em>one pass</em>.','Each IMU row goes through the same streaming loop. No look-ahead after the first 10 s, no second pass, no learned network at run time: the learned part is a handful of time constants fitted on training flights.')+
 `<div class="grid">${card('c12',1,`<div class="flow">${[
 ['Stream & validate','Reads EuRoC CSV line by line; NaN, saturated and all-zero rows are marked as missing.'],
 ['Quiet-window init','Finds the stillest 1 s in the first 10 s: gravity direction, gyro bias, local g, noise floor. Attitude is carried back to frame 0.'],
 ['Trust & spike gate','Per-channel noise level against the start-up floor gives a 0–1 trust; outliers are replaced by the channel low-pass.'],
 ['Strapdown + tilt','Quaternion integration; trust-weighted complementary tilt correction with gyro-bias integral; fast re-level after a gap.'],
 ['Motion prior','Velocity mean reversion and a weak workspace spring, time constants fitted on training flights; speed bound; zero-velocity detector.'],
 ['Rotor-drag aiding','Multirotor physics: sideways specific force ≈ −k × body velocity, k = 0.17 s⁻¹ measured across all flights.'],
 ['Gap fill & blind 5 s','Missing rows are filled at 200 Hz; after failure the model coasts with decaying velocity and yaw rate, tilt held level.']
 ].map((n,i)=>`<div class="node rise" style="--i:${i+1}"><div class="num">STAGE ${i+1}</div><b>${n[0]}</b><p>${n[1]}</p></div>`).join('')}</div>`)}
 ${card('c6',2,`<div class="hd"><h2>The equations, per IMU row</h2></div><pre>ω  = ω_meas − b_g + k_p·trust·(f̂ × û)        tilt correction
b_g ← b_g − k_i·trust·(f̂ × û)·Δt               bias integral
q  ← q ⊗ exp(½ ω Δt)                           attitude
a_w = R(q)·f − g·ẑ                              gravity removed
v  ← (v + a_w Δt) · e^(−Δt/τ_v)                 velocity prior
p  ← p + v Δt − (Δt/τ_p)·p                      workspace spring
v⊥ ← v⊥ + β·trust·Δt·(−f⊥/k − v⊥)               rotor drag
|v| ≤ 3 m/s ;  still → v = 0                    bounds, ZUPT</pre><p class="sub" style="margin-top:8px">f̂: measured specific-force direction · û: world up in body frame · ⊥: perpendicular to the thrust axis</p>`)}

T.calibration=()=>{return head('Start-up calibration','Gravity is unknown. <em>Find it.</em>','The brief withholds gravity alignment. TrustNav searches the first 10 s for the quietest 1 s window, takes gravity direction and gyro bias from it, and integrates the gyro backwards so frame 0 already has the right tilt.')+
 `<div class="grid">${tile(1,'Tilt error, full flight',D.tilt_rms.full.toFixed(2),'°','RMS vs ground truth, 7 flights')}${tile(2,'Without init',D.tilt_rms.naive.toFixed(0),'°','identity attitude assumed')}${tile(3,'Position error removed',pct(L.init.ate_rmse,N.ate_rmse)+'','%','ATE, naive → +init')}${tile(4,'Search window',10,'s','quiet window 1 s, step 0.25 s')}

 ${card('c6',6,`<div class="hd"><h2>Gyro bias tracking · ${sname(seq)}</h2><div class="legend"><span style="--c:${C.cyan}">x</span><span style="--c:${C.violet}">y</span><span style="--c:${C.ok}">z</span></div></div><canvas id="calbg"></canvas><div class="sub">estimate in mrad/s; the integral term keeps learning after start-up, which matters once the jammer starts drifting the bias</div>`)}
 ${card('c7',7,`<div class="hd"><h2>What the calibration found, per flight</h2></div>${tbl(['Flight','Quiet window at','Static?','Local g','Gyro bias |b|'],SEQ.map(s=>{const i=X.init[s];return [s,i.quiet_window_s.toFixed(2)+' s',i.static?'<span class="chip ok">yes</span>':'<span class="chip warn">no</span>',i.g.toFixed(3)+' m/s²',(Math.hypot(...i.bg)*1000).toFixed(1)+' mrad/s']}),[1,3,4])}<p class="sub" style="margin-top:10px">Local g differs from 9.807 because the accelerometer's turn-on bias along gravity is absorbed into it, which is what we want.</p>`)}
 ${card('c5',8,`<div class="hd"><h2>The algorithm</h2></div><ul class="clean"><li>Slide a 1 s window across the first 10 s in 0.25 s steps.</li><li>Score each by gyro spread / 0.02 + accel-norm spread / 0.1; keep the quietest.</li><li><b>Static</b> if gyro spread &lt; 0.05 rad/s and accel spread &lt; 0.15 m/s²: then mean gyro = bias and |mean accel| = local g.</li><li>Tilt = rotation taking mean accel onto world up. Heading is unobservable and left at zero; evo's alignment removes it.</li><li>Integrate the gyro backwards from the window's centre to frame 0, so the first pose is already level.</li><li>The window also sets each channel's noise floor for the trust score.</li></ul><div class="note" style="margin-top:12px"><b>MH_01</b> starts while being moved by hand in our replica, so no window is static and bias falls to the online integral. The official EuRoC files begin on the ground, which is the case the static path is built for.</div>`)}</div>`};

 ].map((x,i)=>card('c6',i+1,`<h2 style="margin-bottom:6px">${x[0]}</h2><p style="margin:0;color:var(--muted)">${x[1]}</p>`)).join('')}
 ${card('c12',5,`<div class="hd"><h2>From drone to headset: what carries over</h2></div>${tbl(['TrustNav component','In a headset or controller','Needs changing'],[['Quiet-window calibration','gyro bias and gravity whenever the user is still','nothing; headsets are still often'],['Trust score & spike gate','detect magnetic, thermal or impact disturbances','thresholds per sensor'],['Tilt correction','keeps the horizon level during camera loss','human motion is gentler; lower gain'],['Motion prior','head and hand motion is bounded and mean-reverting','re-fit τ on head/hand data'],['Rotor drag','not applicable','replace with a body-motion model'],['Blind coasting','bridges camera dropouts of 0.1–2 s','shorter horizon, higher rate'],['4 MB, 0.4 ms/s','fits a wearable or controller MCU budget','fixed-point port']])}`)}
 ${card('c12',6,`<div class="note"><b>Scope.</b> These are application directions, not results. Everything measured on this console is the drone scenario of Track 3.</div>`)}</div>`;

T.roadmap=()=>head('Limits & roadmap','What we know is <em>not solved</em>.','Judges will find these anyway. We would rather show them first, with the plan for each.')+
 `<div class="grid">${card('c6',1,`<div class="hd"><h2>Limitations</h2></div>${tbl(['Limitation','Why it matters','Evidence'],[['Room-scale position only slightly beats holding still','long slow loops look like drift to a degraded IMU','ATE 3.20 vs 3.29 m'],['IMU data is regenerated, not recorded','real sensors have effects our model lacks','Data note'],['Degradation is our replica','the organiser schedule may differ','Stress tests show small sensitivity'],['Heading is unobservable','yaw drifts slowly; evo alignment hides the initial offset','by design of IMU-only'],['Non-static starts lose the gyro-bias head start','MH_01 is our worst flight','Calibration page'],['Prior assumes a bounded workspace','long straight flights would be pulled back','tunable τ_p; off = 0']])}`)}
 ${card('c6',2,`<div class="hd"><h2>Roadmap</h2></div>${tbl(['Step','When','Expected effect'],[['Re-fit all parameters on the official IMU + degradation script','as soon as the package arrives','numbers become the official ones'],['Small learned gyro denoiser (Brossard-style, int8)','after official data','better attitude under jamming'],['Error-state Kalman filter carrying uncertainty (TLIO-style)','next iteration','calibrated confidence for the blind window'],['Trust-adaptive prior: tighten τ only when trust drops','next iteration','keep more real motion in clean phases'],['Fixed-point C port for a microcontroller','product step','same accuracy at < 64 KB RAM']])}`)}
 ${card('c12',3,`<div class="hd"><h2>Questions sent to the organisers</h2></div><ul class="clean"><li>The Track 3 package with the official degradation script.</li><li>Exact checkpoint definition and how errors become points.</li><li>How peak RAM is measured (process RSS or allocations).</li><li>Whether dropout rows are removed or zeroed (we handle both), and which timestamps the blind 5 s should use.</li><li>Whether the hidden set includes TUM-VI handheld sequences (the drag aiding would then be switched off automatically by its trust gate, or by <code>--drag-k 0</code>).</li></ul>`)}</div>`;

T.research=()=>head('Research & sources','Built on <em>published</em> work.','What each source contributed, and where we deliberately stopped short.')+
 `<div class="grid">${card('c6',1,`<h2 style="margin-bottom:10px">Data & evaluation</h2><ul class="clean src">
 <li><a href="https://projects.asl.ethz.ch/datasets/doku.php?id=kmavvisualinertialdatasets" target="_blank" rel="noopener">EuRoC MAV datasets</a> (Burri et al., IJRR 2016)<span>Flight trajectories, ADIS16448 noise model, IMU CSV format.</span></li>
 <li><a href="https://cvg.cit.tum.de/data/datasets/visual-inertial-dataset" target="_blank" rel="noopener">TUM-VI benchmark</a> (Schubert et al., IROS 2018)<span>Named in the brief; the reader accepts its CSV unchanged.</span></li>
 <li><a href="https://github.com/MichaelGrupp/evo" target="_blank" rel="noopener">evo</a> (Grupp)<span>ATE/RPE with Umeyama alignment; our evaluator reproduces evo_ape exactly.</span></li>
 <li><a href="https://github.com/uzh-rpg/rpg_trajectory_evaluation" target="_blank" rel="noopener">rpg_trajectory_evaluation</a> (Zhang & Scaramuzza, IROS 2018)<span>Source of the EuRoC ground-truth copies and of the evaluation conventions.</span></li></ul>`)}
 ${card('c6',2,`<h2 style="margin-bottom:10px">Methods</h2><ul class="clean src">
 <li>Mahony, Hamel, Pflimlin, <a href="https://doi.org/10.1109/TAC.2008.923738" target="_blank" rel="noopener">Nonlinear complementary filters on SO(3)</a>, IEEE TAC 2008<span>Basis of the tilt correction with bias integral.</span></li>
 <li>Leishman, Macdonald, Beard, McLain, <a href="https://doi.org/10.1109/MCS.2013.2287362" target="_blank" rel="noopener">Quadrotors and accelerometers</a>, IEEE CSM 2014<span>Rotor-drag relation used for velocity aiding.</span></li>
 <li>Brossard, Bonnabel, Barrau, <a href="https://arxiv.org/abs/2002.10718" target="_blank" rel="noopener">Denoising IMU gyroscopes with deep learning</a>, 2020<span>Future work once real organiser IMU data is available.</span></li>
 <li><a href="https://arxiv.org/abs/2501.15659" target="_blank" rel="noopener">AirIO</a>, 2025 · <a href="https://arxiv.org/abs/2007.01867" target="_blank" rel="noopener">TLIO</a>, 2020<span>Learned inertial odometry; motivates body-frame features and the drone motion prior.</span></li></ul>`)}
 ${card('c12',3,`<div class="hd"><h2>What we took, and what we did not</h2></div>${tbl(['Idea','Source','Used here?','Why'],[['Complementary tilt filter with bias integral','Mahony 2008','yes','cheap, proven, works without magnetometer'],['Rotor-drag velocity observation','Leishman 2014','yes','measured k = 0.17 on these flights'],['Static initialisation & ZUPT','classic INS practice','yes','free bias and gravity estimate'],['Deep gyro denoiser','Brossard 2020','not yet','would only learn our synthetic noise'],['Learned body-frame velocity','AirIO 2025','tested, dropped','a linear version did not generalise across flights here'],['Network + EKF with uncertainty','TLIO 2020','roadmap','needs real IMU data to train']])}`)}</div>`;

// ---------- router
let cur='overview';
function render(p,keepScroll){stopAll();if(!T[p])p='overview';cur=p;const el=document.getElementById('pages');
 el.innerHTML=`<div class="page on">${T[p]()}</div>`;document.getElementById('crumb').textContent=PAGES.find(x=>x[0]===p)[1];
 nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
 const a=nav.querySelector('a.on'),ind=document.getElementById('navind');if(a){ind.style.transform=`translateY(${a.offsetTop}px)`;ind.style.height=a.offsetHeight+'px'}
 document.getElementById('rail').classList.remove('open');
 if(!keepScroll)scrollTo({top:0,behavior:RM?'auto':'smooth'});
 requestAnimationFrame(()=>{T[p].after&&T[p].after();countUp();tilt()})}
function countUp(){if(RM)return;document.querySelectorAll('[data-count]').forEach(el=>{const v=parseFloat(el.dataset.count);if(!isFinite(v))return;const dec=(el.dataset.count.split('.')[1]||'').length;const u=el.querySelector('small');const us=u?u.outerHTML:'';
 animate(k=>{el.innerHTML=(v*k).toFixed(dec)+us},1000)})}
function tilt(){if(RM||!matchMedia('(hover:hover)').matches)return;document.querySelectorAll('.card.tile').forEach(c=>{c.onpointermove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-2px)`};c.onpointerleave=()=>c.style.transform=''})}
const route=()=>{const h=location.hash.slice(1);render(T[h]?h:'overview')};
addEventListener('hashchange',route);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>render(cur,true),250)});
route();
})();
</script>
